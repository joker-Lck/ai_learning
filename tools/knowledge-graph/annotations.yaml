  - source: "endpoint:GET/books/search"
    target: "service:streaming_service"
    type: "calls_service"

  # Connect remaining 12 isolated nodes

  # bilibili/books 推荐和封面端点 -> streaming_service (外部代理)
  - source: "endpoint:GET/bilibili/recommend"
    target: "service:streaming_service"
    type: "calls_service"
  - source: "endpoint:GET/bilibili/cover"
    target: "service:streaming_service"
