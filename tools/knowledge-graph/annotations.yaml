  - source: "page:assessment-quiz"
    target: "component:QuizModule"
    type: "routes_to"

  # component:index 是 animations 目录的导出，连到 BackgroundEffects
  - source: "component:index"
    target: "component:BackgroundEffects"
    type: "imports"

  # ErrorBoundary 在 layout 中使用，包裹所有页面
  - source: "page:layout"
    target: "component:ErrorBoundary"
    type: "routes_to"

  # constants 和 types 是模块工具文件，被 DashboardContent 等使用
  - source: "component:DashboardContent"
    target: "component:constants"
    type: "imports"
  - source: "component:DashboardContent"
    target: "component:types"
    type: "imports"

  # pyproject.toml 定义 Python 依赖，连接到 Dockerfile
  - source: "config:pyproject.toml"
    target: "config:Dockerfile"
    type: "configured_by"

  # tailwind.config.ts 是前端 CSS 配置，连接到前端 package.json
  - source: "config:tailwind.config.ts"
    target: "config:package.json"
    type: "configured_by"

