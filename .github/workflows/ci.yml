name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check backend/ services/ data/ core/ --select E,F,W,I --ignore E501,W291,W293,E402,F841,F401,E701,E722,E741,F821 --exclude core/ui_components.py

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart PyJWT bcrypt slowapi
          pip install openai python-dotenv requests
          pip install numpy pandas Pillow
          pip install pydantic pydantic-settings
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
      - name: Create test .env
        run: |
          echo "JWT_SECRET=test_secret_key_for_ci_only_32chars!!" > .env
          echo "MIMO_API_KEY=test_api_key" >> .env
          echo "MIMO_BASE_URL=https://api.mimo.ai/v1" >> .env
      - name: Initialize test databases
        run: python scripts/init_databases_v7.2.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run tests
        run: pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET: test_secret_key_for_ci_only_32chars!!
          MIMO_API_KEY: test_api_key
          MIMO_BASE_URL: https://api.mimo.ai/v1
