name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check backend/ services/ data/ core/ tests/"

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx

      - name: Create test .env
        run: |
          echo "JWT_SECRET=test_secret_key_for_ci_only_32chars!!" > .env
          echo "MIMO_API_KEY=test_api_key" >> .env
          echo "MIMO_BASE_URL=https://api.mimo.ai/v1" >> .env

      - name: Initialize test databases
        run: python scripts/init_databases_v7.2.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=backend --cov=services --cov=data --cov=core --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyright
      - run: pyright --version
        continue-on-error: true
